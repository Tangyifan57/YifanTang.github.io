<div class="timeline">
{% for item in site.data.education %}
<div class="timeline-item in-view{% if item.current %} timeline-item--current{% endif %}">
  <div class="timeline-dot institution-mark" aria-hidden="true">{{ item.initials }}</div>
  <div class="timeline-card">
    <div class="timeline-header"><div class="timeline-role">{{ item.institution }}</div><span class="timeline-time">{{ item.dates }}</span></div>
    <div class="degree-name">{{ item.degree }}</div>
    <div class="timeline-details">{{ item.school }}<br>Advisor{% if forloop.index == 2 %}s{% endif %}: {{ item.advisors }}<br>{{ item.details }}</div>
  </div>
</div>
{% endfor %}
</div>

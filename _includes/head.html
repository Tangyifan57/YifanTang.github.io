<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title | escape }} · Yifan Tang">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.og_image | prepend: '/images/' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/images/yifan-avatar.svg' | relative_url }}">
<script>
(function(){try{var os=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var s=JSON.parse(localStorage.getItem('theme')||'null');document.documentElement.setAttribute('data-theme',s&&s.os===os?s.choice:os);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
